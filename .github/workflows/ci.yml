name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.x
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:build
      - run: pnpm stories:build

  # Every story variant, light and dark, against the references in
  # apps/histoire/visual/__screenshots__ (made by the same image: `pnpm --filter
  # @textone-com/histoire visual:update`). On a difference the report is kept as an artifact.
  visual:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      # The Playwright image's Node has no corepack: install the pnpm the repo pins.
      - run: npm install -g pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm stories:build
      - run: pnpm --filter @textone-com/histoire visual:ci
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: apps/histoire/visual/report
